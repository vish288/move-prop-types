# pnpm settings (pnpm no longer reads the "pnpm" field in package.json).
#
# Supply-chain defaults relied on from pnpm >= 11:
# - dependency build scripts only run when approved in allowBuilds
# - newly published versions are held back for 24h (minimumReleaseAge)

# Dependency build scripts, reviewed one by one (true = run, false = skip)
allowBuilds:
  # postinstall only validates the platform binary shipped via optionalDependencies
  esbuild: false

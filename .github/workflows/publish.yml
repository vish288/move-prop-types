name: Publish

on:
  push:
    # main releases the current major; N.x branches release maintenance versions
    branches: [main, '[0-9]+.x']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish to npm (for example v1.1.3)
        required: true
        type: string
      dist_tag:
        description: npm dist-tag to publish under
        required: true
        default: latest
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm run lint:check

      - name: Run type checking
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test:ci

      - name: Build project
        run: pnpm run build

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || endsWith(github.ref, '.x'))
    permissions:
      contents: write # create release tags and GitHub releases
      issues: write # comment on released issues
      pull-requests: write # comment on released pull requests
      id-token: write # npm trusted publishing and provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # semantic-release 25 and its plugins require Node.js >= 22.14 / 24.15
          node-version: 24
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # npm authentication uses trusted publishing (OIDC via id-token: write); no npm token is stored
        run: pnpm exec semantic-release

  publish-tag:
    name: Publish existing tag
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write # create the GitHub release for the tag
      id-token: write # npm trusted publishing and provenance
    env:
      TAG: ${{ inputs.tag }}
      DIST_TAG: ${{ inputs.dist_tag }}
    steps:
      - name: Validate inputs
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag such as v1.2.3"
            exit 1
          fi
          if [[ ! "$DIST_TAG" =~ ^[a-z][a-z0-9-]*$ ]]; then
            echo "::error::'$DIST_TAG' is not a valid npm dist-tag"
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the version can be published
        run: |
          NPM_VERSION="$(npm --version)"
          if [ "$(printf '%s\n%s\n' 11.5.1 "$NPM_VERSION" | sort -V | head -1)" != 11.5.1 ]; then
            echo "::error::npm $NPM_VERSION does not support trusted publishing (11.5.1 or later is required)"
            exit 1
          fi
          if npm view "move-prop-types@$VERSION" version > /dev/null 2>&1; then
            echo "::notice::move-prop-types@$VERSION is already on npm; skipping npm publish"
            echo "SKIP_NPM=true" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$DIST_TAG" = latest ]; then
            LATEST="$(npm view move-prop-types dist-tags.latest)"
            if [[ "$VERSION" == *-* ]] || [ "$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
              echo "::error::$VERSION must not become 'latest' (current latest is $LATEST); use another dist_tag"
              exit 1
            fi
          fi

      - name: Publish to npm
        if: env.SKIP_NPM != 'true'
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm publish --tag "$DIST_TAG"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::GitHub release $TAG already exists"
          else
            LATEST_FLAG=--latest=false
            if [ "$DIST_TAG" = latest ]; then LATEST_FLAG=--latest; fi
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$TAG" "$LATEST_FLAG"
          fi

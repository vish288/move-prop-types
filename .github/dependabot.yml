version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Let new releases age a few days before proposing them (security updates are not delayed)
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      # Runtime dependency updates ship a patch release; dev tooling does not
      prefix: fix
      prefix-development: build
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ['*']
